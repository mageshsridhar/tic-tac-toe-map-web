<meta charset="utf-8">
<title>Tic-Tac-Toe Game Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: the same three layouts as the iPad app.
   Wide (landscape): a 380px column (title, game, legend, credit) beside a full-height map.
   Upright (portrait): game card beside a column of title, legend and credit; the map spans the width below.
   Narrow (phones): one column. Pastel palette with deeper ink shades for small text; pixel-art X and O. */
:root{
  --bg:#f6f3fa; --surface:#fffdff; --sunk:#f0ecf6; --line:#e2dcec; --edge:#c2b8d6; --fg:#403a55; --muted:#776f8d; --shadow:#40385a;
  --x:#7ba6e6; --o:#ec8fa8; --draw:#aea8bf; --x-soft:#e3edfb; --o-soft:#fce6ed; --d-soft:#eeebf3;
  --x-ink:#3e6db5; --o-ink:#b5506f; --d-ink:#6c6680;
  --win:#fff0b0; --win-fg:#403a55; --focus:#a78bd8;
  --font:"Nunito",ui-rounded,system-ui,sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1e1b2b; --surface:#262236; --sunk:#221f31; --line:#3a3550; --edge:#5a5378; --fg:#f1edf8; --muted:#b3abc9; --shadow:#000;
  --x:#9cc3f5; --o:#f7a8bf; --draw:#c3bdd3; --x-soft:#2d3652; --o-soft:#45293a; --d-soft:#322e43;
  --x-ink:#acd0f8; --o-ink:#f9b8ca; --d-ink:#cdc7db;
  --win:#5c5232; --win-fg:#fff6d6; --focus:#cbb2f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1b2b; --surface:#262236; --sunk:#221f31; --line:#3a3550; --edge:#5a5378; --fg:#f1edf8; --muted:#b3abc9; --shadow:#000;
  --x:#9cc3f5; --o:#f7a8bf; --draw:#c3bdd3; --x-soft:#2d3652; --o-soft:#45293a; --d-soft:#322e43;
  --x-ink:#acd0f8; --o-ink:#f9b8ca; --d-ink:#cdc7db;
  --win:#5c5232; --win-fg:#fff6d6; --focus:#cbb2f0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Page layouts */
.app{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);
  grid-template-areas:"head" "game" "legend" "map" "credit"}
.aside{display:contents}
.head{grid-area:head} .game{grid-area:game} .legend{grid-area:legend} .credit{grid-area:credit} .map{grid-area:map;min-height:460px}
@media (min-width:900px) and (orientation:landscape){
  .app{column-gap:22px;grid-template-columns:380px minmax(0,1fr);grid-template-rows:auto auto minmax(196px,1fr) auto;
    grid-template-areas:"head map" "game map" "legend map" "credit map";min-height:calc(100dvh - 40px)}
  .legend{contain:size} /* sized by the space it's given, never by its dots (which size themselves to that space) */
}
@media (min-width:800px) and (orientation:portrait){
  .app{column-gap:22px;grid-template-columns:380px minmax(0,1fr);grid-template-rows:auto minmax(460px,1fr);
    grid-template-areas:"game aside" "map map";min-height:calc(100dvh - 40px)}
  .aside{display:flex;flex-direction:column;gap:18px;grid-area:aside;min-width:0}
  .aside .legend{flex:1 1 0;min-height:196px;contain:size}
}
/* Phones: a compact game card (status and icon buttons on top, then the board) so the game and the map share one screen.
   The map's height (--map-h) is set by script to fill what's left of the screen. */
@media (max-width:899px) and (orientation:landscape),(max-width:799px){
  .app{gap:14px}
  .app .game{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"turn controls" "board board";gap:14px;padding:16px;align-items:center}
  .app .turn{grid-area:turn} .app .board{grid-area:board;justify-self:center;width:min(100%,32svh)}
  .app .turn .sub{display:none} /* best play is already shown on the map */
  .app .controls{grid-area:controls;gap:8px}
  .app .controls .btn{flex:none;width:44px;height:44px;padding:0;border-radius:50%}
  .app .controls .btn .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .app .map{height:var(--map-h,460px);min-height:0}
  .app .legend{padding:18px}
}
@media (max-width:799px) and (orientation:portrait){
  .app{grid-template-areas:"head" "game" "map" "legend" "credit"}
}
@media (max-width:899px) and (orientation:landscape){
  .app{column-gap:14px;grid-template-columns:minmax(0,360px) minmax(0,1fr);grid-template-rows:auto auto 1fr;
    grid-template-areas:"head map" "game map" "legend legend" "credit credit"}
  .app .board{width:min(100%,calc(100svh - 196px))}
}

/* Title and theme switch */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:800 28px/1.15 var(--font);margin:0;letter-spacing:-.01em;white-space:nowrap}
@media (max-width:799px){h1{font-size:clamp(19px,6.2vw,28px)}}
.round{width:44px;height:44px;display:grid;place-items:center;flex:none;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:50%;cursor:pointer}
.round:hover{border-color:var(--edge)}
:is(.round,.btn,.recenter,.cell):focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* Cards */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:22px;min-width:0}
.game{display:flex;flex-direction:column;gap:20px}

/* Status */
.turn{display:flex;align-items:center;gap:14px}
.mark{width:40px;height:40px;display:grid;place-items:center;font:800 22px var(--font);flex:none;border-radius:var(--r-sm)}
.mark.X{background:var(--x-soft);color:var(--x-ink)} .mark.O{background:var(--o-soft);color:var(--o-ink)} .mark.D{background:var(--d-soft);color:var(--d-ink)}
.turn h2{font:800 20px/1.2 var(--font);margin:0}
.turn>div{min-width:0}
.turn .sub{color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} /* one line, so the card never changes height */
.pill{display:inline-block;font:700 13px/1.6 var(--font);padding:0 10px;white-space:nowrap;border-radius:999px}
.pill.X{background:var(--x-soft);color:var(--x-ink)} .pill.O{background:var(--o-soft);color:var(--o-ink)} .pill.D{background:var(--d-soft);color:var(--d-ink)}

/* Board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));aspect-ratio:1;width:100%;max-width:330px;align-self:center;gap:8px}
.cell{position:relative;border:0;background:var(--sunk);transition:background-color .2s ease;border-radius:var(--r-md);padding:0;color:var(--fg);cursor:pointer;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden}
.cell svg{width:46%;height:46%;fill:currentColor;shape-rendering:crispEdges;grid-area:1/1}
.cell.X{color:var(--x)} .cell.O{color:var(--o)}
.cell[aria-disabled="true"]{cursor:default}
.cell:not([aria-disabled="true"]):hover,.cell.peek{background:var(--line)}
.cell .ghost{opacity:0;color:var(--gc)}
.cell:not([aria-disabled="true"]):hover .ghost,.cell.peek .ghost{opacity:.3}
.cell.w{background:var(--win);color:var(--win-fg)}
.controls{display:flex;gap:12px}
.btn{flex:1;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15px var(--font);color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:999px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--edge)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--x-soft);color:var(--x-ink);border-color:var(--x)}

/* Legend: dots grow to fill the card (--dot), rows spread over its height */
.legend{--dot:8px;--gap:2px;display:flex}
.meter{display:flex;flex-direction:column;justify-content:space-between;gap:12px;flex:1;min-width:0}
.meter h3{font:800 12px/1.5 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter h3 b{font:700 14px/1 var(--font);color:var(--fg);letter-spacing:0}
.eg{display:grid;grid-template-columns:118px max-content;gap:12px;align-items:start}
/* each label lines up with the middle of its first row of dots */
.el{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:7px;color:var(--muted);line-height:18px;white-space:nowrap;margin-top:calc((var(--dot) - 18px) / 2)}
.el i{width:10px;height:10px;border-radius:50%}
.el b{font:700 13px/18px var(--font);color:var(--fg)}
.dots{display:grid;grid-template-columns:repeat(var(--cols,20),var(--dot));gap:var(--gap)}
.dots i{--c:var(--line);width:var(--dot);height:var(--dot);background:var(--c);opacity:.6;border-radius:50%;position:relative}
.dots i.on{opacity:1} .dots i.on.X{--c:var(--x)} .dots i.on.O{--c:var(--o)} .dots i.on.D{--c:var(--draw)}
/* the ending you reached: a smaller dot inside a ring that stays within its own cell */
.dots i.final{background:radial-gradient(circle closest-side,var(--c) 60%,transparent 64%)}
.dots i.final::after{content:"";position:absolute;inset:calc(var(--gap) / -2);border:calc(var(--dot) / 6) solid var(--fg);border-radius:50%}

/* Credit */
.credit{display:flex;align-items:center;gap:14px;padding:18px}
/* the author's memoji, as tall as the lines of text beside it (--text-h is measured by script) */
.badge{display:flex;flex:none}
.badge img{height:var(--text-h,58px);width:auto;display:block}
.credit small{display:block;font:800 12px/1.4 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.credit strong{display:block;font:700 17px/1.3 var(--font)}
.credit p{margin:0;color:var(--muted);font-size:13px}

/* Map */
.map{position:relative;background:var(--surface);overflow:hidden;min-width:0;border:2px solid var(--line);border-radius:var(--r-lg)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
/* the map fades out under its heading, so boards never run into the text */
.maphead{position:absolute;left:0;top:0;right:0;height:120px;padding:14px 150px 0 16px;pointer-events:none;isolation:isolate}
/* A solid backdrop faded out by a mask (a plain colour, so it eases with the theme switch like everything else) */
.maphead::before{content:"";position:absolute;inset:0;z-index:-1;background-color:var(--surface);
  -webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.maphead b{font:800 17px/1.4 var(--font)}
.maphead p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.recenter{position:absolute;right:12px;top:12px;min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 16px;font:700 15px var(--font);color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:999px;cursor:pointer;z-index:1}
.recenter:hover{border-color:var(--edge)}
/* Phones: Recenter becomes a round icon, and the heading sits on the same line, centred with it */
@media (max-width:899px) and (orientation:landscape),(max-width:799px){
  .maphead{padding:12px 68px 0 16px;height:86px}
  .maphead b{display:block;line-height:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .maphead p{display:none}
  .recenter{width:44px;padding:0;justify-content:center;border-radius:50%}
  .recenter .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
}
.colhead{font:800 10px var(--font);letter-spacing:.06em;fill:var(--muted);text-anchor:end;dominant-baseline:central}
.link{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.link.path{stroke:var(--muted)}
.link.hot{stroke:var(--focus);stroke-width:3}
.traveler{fill:var(--focus);stroke:var(--surface);stroke-width:2}
.node{cursor:pointer;outline:none}
.node .frame{fill:var(--surface);stroke:var(--line);stroke-width:2}
.node .gl{fill:var(--line)} .node .mx{fill:var(--x)} .node .mo{fill:var(--o)} .node .wc{fill:var(--win)}
.node.cand .frame{stroke:var(--edge);stroke-dasharray:4 4}
.node.cand:hover .frame,.node.cand:focus-visible .frame,.node.peek .frame{stroke:var(--fg);stroke-dasharray:none;stroke-width:3}
.node.cand.chosen .frame{stroke:var(--focus);stroke-dasharray:none;stroke-width:3}
.node.past:hover .frame,.node.past:focus-visible .frame{stroke:var(--fg)}
.node.cur .frame{stroke:var(--focus);stroke-width:3}
.node.cur .frame.f-X{stroke:var(--x)} .node.cur .frame.f-O{stroke:var(--o)} .node.cur .frame.f-D{stroke:var(--draw)}
.tag text{font:800 13px var(--font);dominant-baseline:central}
.tag.X text{fill:var(--x-ink)} .tag.O text{fill:var(--o-ink)} .tag.D text{fill:var(--d-ink)}
.cnt{font:600 12px var(--font);fill:var(--muted)}

/* The copy of the play board that turns to match the map and flies onto its option */
.flight{position:fixed;z-index:20;pointer-events:none;padding:6px;background:var(--surface);border-radius:calc(var(--r-lg) + 2px);
  box-shadow:0 10px 30px color-mix(in srgb,var(--shadow) 22%,transparent);will-change:transform,opacity}
.flight .board{max-width:none;height:100%}
.flight svg.mini{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);opacity:0;overflow:visible}

/* Theme switch: the browser's default cross-fade is replaced by the bubble animation in the script */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2} ::view-transition-old(root){z-index:1}
/* Gradual theme change, only while switching (browsers without View Transitions) */
.theming,.theming *,.theming *::before,.theming *::after{
  transition:background-color .5s ease,color .5s ease,border-color .5s ease,fill .5s ease,stroke .5s ease!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <main class="app">
    <section class="card game" aria-label="Game">
      <div class="turn">
        <div class="mark X" id="tmark" aria-hidden="true">X</div>
        <div><h2 id="tstatus">X to move</h2><div class="sub" id="tsub"></div></div>
      </div>
      <div class="board" id="board" role="group" aria-label="Board"></div>
      <div class="controls">
        <button class="btn" type="button" id="undo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="lbl">Undo</span></button>
        <button class="btn primary" type="button" id="restart"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/></svg><span class="lbl">New game</span></button>
      </div>
    </section>

    <div class="aside">
      <header class="head">
        <h1>Tic-Tac-Toe Game Map</h1>
        <button class="round" type="button" id="theme" aria-label="Switch to dark mode"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path id="theme-icon" d=""/></svg></button>
      </header>
      <section class="card legend" aria-label="Endings">
        <div class="meter" id="meter">
          <h3><span id="mlabel">Endings still possible</span><b id="mcount">138 / 138</b></h3>
        </div>
      </section>
      <section class="card credit" aria-label="Credits">
        <div class="badge" aria-hidden="true"><img src="avatar.png" alt=""></div>
        <div id="credit-text"><small>Made by</small><strong>Magesh Sridhar</strong><p>Built with D3.js · Assisted by Claude Code</p></div>
      </section>
    </div>

    <section class="map" aria-label="Game map">
      <svg id="map" role="img" aria-label="Map of the game so far and the possible next moves"></svg>
      <div class="maphead"><b id="mhead">Start: empty board</b><p id="mhint">Dashed boards are your options. Click one to play it, or click an earlier board to go back.</p></div>
      <button class="recenter" type="button" id="recenter"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span class="lbl">Recenter</span></button>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const ENDINGS = /*DATA*/;
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const ROT=[6,3,0,7,4,1,8,5,2],MIR=[2,1,0,5,4,3,8,7,6];
const SYMS=(()=>{const comp=(a,b)=>b.map(i=>a[i]);
  const s=[[0,1,2,3,4,5,6,7,8]];for(let i=0;i<3;i++)s.push(comp(s[s.length-1],ROT));return s.concat(s.map(t=>comp(t,MIR)))})();
const canon=k=>SYMS.map(t=>t.map(i=>k[i]).join("")).sort()[0];
const winnerOf=b=>{for(const l of LINES){const p=b[l[0]];if(p!=="."&&p===b[l[1]]&&p===b[l[2]])return p}return b.includes(".")?null:"D"};
const winCells=b=>{const w=winnerOf(b),s=new Set();if(w&&w!=="D")LINES.forEach(l=>{if(l.every(i=>b[i]===w))l.forEach(i=>s.add(i))});return s};
const turnOf=b=>b.split("X").length===b.split("O").length?"X":"O";
const put=(b,c)=>b.slice(0,c)+turnOf(b)+b.slice(c+1);
const RTXT={X:"X wins",O:"O wins",D:"Draw"};

// The mirror and quarter turns (clockwise; -1 = one anticlockwise) taking board a to board b, fewest steps first
function orientation(a,b){let best=null;
  for(const flip of [false,true]){let c=flip?MIR.map(i=>a[i]).join(""):a;
    for(let k=0;k<4;k++){if(c===b){const t=k===3?-1:k,cost=(flip?1:0)+Math.abs(t);if(!best||cost<best.cost)best={flip,turns:t,cost}}
      c=ROT.map(i=>c[i]).join("")}}
  return best}

// Solve every position once: best-play result and which endings stay reachable
const VAL=new Map(),ENDS=new Map();
function solve(k){if(VAL.has(k))return;const w=winnerOf(k);
  if(w){VAL.set(k,w);ENDS.set(k,new Set([k]));return}
  const p=turnOf(k),rank=p==="X"?{X:2,D:1,O:0}:{O:2,D:1,X:0},s=new Set();let best=null;
  for(let c=0;c<9;c++)if(k[c]==="."){const ck=canon(put(k,c));solve(ck);
    const v=VAL.get(ck);if(best===null||rank[v]>rank[best])best=v;ENDS.get(ck).forEach(e=>s.add(e))}
  VAL.set(k,best);ENDS.set(k,s)}
const info=b=>{const k=canon(b);solve(k);return{k,v:VAL.get(k),ends:ENDS.get(k)}};

// Legend, ordered X wins, O wins, draws
const ER={X:0,O:1,D:2},rOf=d=>d.r==="Draw"?"D":d.r[0];
const ORDER=ENDINGS.map((d,i)=>i).sort((a,b)=>ER[rOf(ENDINGS[a])]-ER[rOf(ENDINGS[b])]||ENDINGS[a].m-ENDINGS[b].m);
const COLORV={X:"var(--x)",O:"var(--o)",D:"var(--draw)"},groupDots={},groupCount={};
const meterEl=document.getElementById("meter");
["X","O","D"].forEach(r=>{const row=document.createElement("div");row.className="eg";
  row.innerHTML=`<div class="el"><i style="background:${COLORV[r]}"></i><span>${RTXT[r]}</span><b></b></div><div class="dots" aria-hidden="true"></div>`;
  meterEl.appendChild(row);groupDots[r]=row.querySelector(".dots");groupCount[r]=row.querySelector("b")});
const dotFor=new Map(ORDER.map(i=>{const r=rOf(ENDINGS[i]),el=document.createElement("i");el.className=r;groupDots[r].appendChild(el);return[ENDINGS[i].b,el]}));
// The dots size themselves to the card: try each column count and keep the one that gives the
// biggest dots that still fit beside the labels and, where the card has a set height, within it.
// Where the card simply grows with its content (phones), the dots stop at a comfortable 11px.
const legendEl=document.querySelector(".legend");
const fillsHeight=matchMedia("(min-width:900px) and (orientation:landscape),(min-width:800px) and (orientation:portrait)");
function sizeLegend(){const cs=getComputedStyle(legendEl),w=legendEl.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),
    h=legendEl.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),avail=w-130; // 118px labels + 12px gap
  let best={s:0,c:20};
  for(let c=24;c>=8;c--){ // gaps are a quarter of a dot
    const rows=Math.ceil(91/c)+Math.ceil(44/c)+1;
    let s=avail/(c*1.25-.25);
    s=fillsHeight.matches?Math.min(s,(h-20-3*12)/(rows*1.25-.75)):Math.min(s,11);
    s=Math.min(s,22);
    if(s>best.s+.05)best={s,c}}
  const s=Math.max(4,best.s);
  legendEl.style.setProperty("--dot",s.toFixed(2)+"px");legendEl.style.setProperty("--gap",(s/4).toFixed(2)+"px");legendEl.style.setProperty("--cols",best.c)}

// The copy of the play board: lifts off, mirrors and turns to match the option, then shrinks and flies onto it
function flyCopy(played,target,optFrame,ck,tok,then){

  face.querySelectorAll(".cell").forEach(n=>{n.classList.remove("peek");n.setAttribute("tabindex","-1")});el.appendChild(face);

  const k=to.width/S,g=mini.append("g").attr("class","node cand chosen");drawBoard(g,played,S);

    el.animate([{transform:at(0,0,r,f,.94)},{transform:at(dx,dy,r,f,k)}],{duration:550,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"});

// Phones: the current board sits just below the heading fade, with its next moves under it.
// Earlier moves stay above, out of view; pinch or scroll to zoom out and see them.
// Upright, the map's height is set once from the screen width (room for a board and three options)
// and never changes as the game goes on.
function phoneCamera(animate,n,cs,over){
  const head=90;let h=H; // head: the heading fade is 86px tall, so the map starts just below it
  if(phoneUpright.matches){const mapH=Math.round(head+(PS/2+6+COL+CS/2+46)*Math.min(1.2,(W-16)/(2*(PS/2+190)))+12);
    mapEl.style.setProperty("--map-h",mapH+"px");h=mapH-4} // 4: the map's border

function renderSide(){const b=cur(),w=winnerOf(b),{k,v,ends}=info(b),n=hist.length-1,p=turnOf(b),wc=winCells(b);

    "Dashed boards are your options. Click one to play it, or click an earlier board to go back.";}

// Light / dark switch: starts from the saved choice, else the system setting
const SUN="M12 3v2M12 19v2M5.6 5.6 7 7M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4 7 17M17 7l1.4-1.4M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z";
const MOON="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z";
const sysDark=matchMedia("(prefers-color-scheme: dark)");
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":sysDark.matches};
function syncTheme(){const d=isDark();
  document.getElementById("theme-icon").setAttribute("d",d?SUN:MOON);
  document.getElementById("theme").setAttribute("aria-label",d?"Switch to light mode":"Switch to dark mode")}
try{const s=localStorage.getItem("ttt-theme");if(s==="light"||s==="dark")document.documentElement.dataset.theme=s}catch(e){}
let themeTimer=0;
// The new theme grows out of the switch as a bubble (a View Transition whose new snapshot is
// revealed through an expanding circle). Without View Transitions the colours fade instead.
document.getElementById("theme").onclick=e=>{const next=isDark()?"light":"dark",el=document.documentElement;
  const apply=()=>{el.dataset.theme=next;try{localStorage.setItem("ttt-theme",next)}catch(err){}syncTheme()};
  if(reduce){apply();return}
  if(!document.startViewTransition){
    el.classList.add("theming");clearTimeout(themeTimer);themeTimer=setTimeout(()=>el.classList.remove("theming"),700);
    apply();return}
  const b=e.currentTarget.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2;
  const r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(apply).ready.then(()=>el.animate(
    {clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},
    {duration:650,easing:"cubic-bezier(.4,0,.2,1)",pseudoElement:"::view-transition-new(root)"})).catch(()=>{})};
sysDark.addEventListener("change",syncTheme);
syncTheme();

sizeMap();size();render();sizeLegend();
// Redraw once the web font loads so text is measured correctly
document.fonts&&document.fonts.ready.then(()=>{sizeMap();drawMap();peek()});
</script>
